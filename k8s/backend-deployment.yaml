apiVersion: apps/v1
kind: Deployment
metadata:
  name: payvora-backend
  labels:
    app: payvora-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payvora-backend
  template:
    metadata:
      labels:
        app: payvora-backend
    spec:
      containers:
        - name: backend
          image: payvora-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: payvora-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payvora-backend
spec:
  selector:
    app: payvora-backend
  ports:
    - port: 8080
      targetPort: 8080
